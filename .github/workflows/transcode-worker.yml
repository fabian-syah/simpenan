name: Simpenan Video Transcoder Worker

on:
  workflow_dispatch: # Manual trigger button in GitHub Actions
  schedule:
    - cron: '*/20 * * * *' # Auto-runs every 20 minutes in the cloud

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Write .env from ENV_FILE secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf "%s\n" "$ENV_CONTENT" > .env

      - name: Run Transcoder Batch
        run: npx tsx --env-file=.env scripts/worker.ts --once
