# ============================================================
# ⚠️ DISABLED — GitHub Actions Transcoder
# ============================================================
# This workflow has been intentionally disabled to comply with
# GitHub's Acceptable Use Policy. Using GitHub Actions runners
# for FFmpeg video processing (non-CI/CD compute workload) is
# a ToS violation that risks account suspension.
#
# Videos are now stored and served in their original format.
# If multi-resolution transcoding is needed in the future,
# migrate to a proper compute service (e.g., Cloudflare Workers,
# Google Cloud Run, AWS Lambda with FFmpeg layer).
# ============================================================

name: Simpenan Video Transcoder Worker (DISABLED)

# All triggers disabled
on:
  workflow_dispatch: # Keep manual trigger only for emergencies

jobs:
  transcode:
    if: false # ← This prevents the job from ever running
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Write .env from ENV_FILE secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf "%s\n" "$ENV_CONTENT" > .env

      - name: Run Transcoder Batch
        run: node --env-file=.env node_modules/tsx/dist/cli.mjs scripts/worker.ts --once
